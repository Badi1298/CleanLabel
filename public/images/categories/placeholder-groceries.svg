<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Grocery Bag / Basket -->
  <defs>
    <linearGradient id="bagGrad" x1="20" y1="45" x2="100" y2="105" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E2B180"/>
      <stop offset="1" stop-color="#C58F5B"/>
    </linearGradient>
    <linearGradient id="appleGrad" x1="68" y1="46" x2="94" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5252"/>
      <stop offset="1" stop-color="#D32F2F"/>
    </linearGradient>
    <linearGradient id="bagFold" x1="25" y1="45" x2="95" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5CE9F"/>
      <stop offset="1" stop-color="#DCA26E"/>
    </linearGradient>
    <linearGradient id="breadGrad" x1="30" y1="18" x2="52" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6C27A"/>
      <stop offset="1" stop-color="#C98A3A"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="50" y1="28" x2="72" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66BB6A"/>
      <stop offset="1" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="carrotGrad" x1="72" y1="28" x2="88" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF9800"/>
      <stop offset="1" stop-color="#E65100"/>
    </linearGradient>
    <filter id="shadow" x="14" y="16" width="92" height="96" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Baguette / French Bread peaking out -->
    <path d="M34 50 L42 24 C44 17 50 16 54 20 L58 25 C62 30 60 36 56 42 L50 54 Z" fill="url(#breadGrad)"/>
    <path d="M41 27 C43 25 47 27 46 29" stroke="#9E6219" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M45 34 C47 32 51 34 50 36" stroke="#9E6219" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M49 41 C51 39 55 41 54 43" stroke="#9E6219" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Green Leaves / Fresh Celery -->
    <path d="M62 48 C58 35 52 28 50 25 C58 24 64 30 65 37 C68 30 76 28 80 30 C78 38 72 44 64 49" fill="url(#leafGrad)"/>
    <path d="M57 32 C61 36 63 42 63 45" stroke="#1B5E20" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Carrot peaking out -->
    <path d="M74 46 L82 32 C84 29 87 29 89 31 C90 34 89 37 86 42 L78 50 Z" fill="url(#carrotGrad)"/>
    <path d="M84 31 C86 26 89 25 91 27 C90 29 88 32 87 33" stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Grocery Paper Bag Body -->
    <path d="M26 50 L32 98 C32.5 101.5 35.5 104 39 104 L81 104 C84.5 104 87.5 101.5 88 98 L94 50 Z" fill="url(#bagGrad)"/>
    <!-- Fold details -->
    <path d="M24 48 C24 45.8 25.8 44 28 44 L92 44 C94.2 44 96 45.8 96 48 L94 54 L26 54 Z" fill="url(#bagFold)"/>
    <path d="M34 54 L39 99" stroke="#B87D47" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2"/>
    <path d="M86 54 L81 99" stroke="#B87D47" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 2"/>
    <path d="M48 68 C52 74 68 74 72 68" stroke="#A76E3A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Red Shiny Apple on the right/front -->
    <circle cx="80" cy="62" r="14" fill="url(#appleGrad)"/>
    <!-- Apple highlight -->
    <path d="M73 54 C76 52 80 52 82 54" stroke="#FFA4A4" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M80 48 C81 45 83 44 85 44" stroke="#5D4037" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M84 45 C86 43 89 44 89 46 C87 47 85 47 84 45" fill="#4CAF50"/>
  </g>
</svg>